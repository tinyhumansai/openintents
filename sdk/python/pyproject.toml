[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "openintents"
version = "0.2.0"
description = "Python SDK for OpenIntents, the agentic API to buy anything"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{ name = "TinyHumans AI" }]
keywords = ["openintents", "agents", "agentic", "payments", "sdk"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.28.1,<1"]

[project.urls]
Homepage = "https://openintents.io"
Documentation = "https://openintents.io/docs"
Repository = "https://github.com/tinyhumansai/openintents"

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0", "ruff>=0.16.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/openintents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
