[package]
name = "openintents"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "GPL-3.0-or-later"
description = "Rust SDK for OpenIntents, the agentic API to buy anything"
repository = "https://github.com/tinyhumansai/openintents"
homepage = "https://openintents.io"
documentation = "https://docs.rs/openintents"
readme = "README.md"
keywords = ["openintents", "agents", "agentic", "payments", "sdk"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
uuid = { version = "1", features = ["v4"] }
hmac = "0.13"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

# The `openintents` binary. Optional so library users don't pull it in.
clap = { version = "4", features = ["derive", "env"], optional = true }

[features]
cli = ["dep:clap", "tokio/macros", "tokio/rt-multi-thread"]

[[bin]]
name = "openintents"
path = "src/cli/main.rs"
required-features = ["cli"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wiremock = "0.6"
