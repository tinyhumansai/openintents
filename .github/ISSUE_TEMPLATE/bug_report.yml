name: Bug report
description: Something in an SDK, the CLI or the spec doesn't work as documented.
labels: [bug]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options: [TypeScript SDK, CLI, Python SDK, Rust SDK, OpenAPI spec, Skill / Claude plugin]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Include a minimal reproduction. Remove API keys and personal data.
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: "OS, Node/Python/Rust version, test or live key"
