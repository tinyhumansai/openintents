name: Release

# Manual: tick the SDKs to publish and pick the bump. The prepare job bumps
# every SDK version together (sdk/bump-versions.mjs), refuses a version a
# selected registry already has, commits to main and tags vX.Y.Z; each selected
# SDK is then published from that commit, and with all three selected the
# verify job checks that npm, PyPI and crates.io report the one version.
# `current` publishes the version the files already carry (to catch a registry
# up, or to retry one publish that failed: untick the ones that went through).
# Secrets: NPM_TOKEN, CARGO_REGISTRY_TOKEN (repository), PYPI_API_TOKEN (on the
# "Production" environment, which only main can deploy to).

on:
  workflow_dispatch:
    inputs:
      typescript:
        description: Publish the TypeScript SDK + CLI to npm
        type: boolean
        default: true
      python:
        description: Publish the Python SDK to PyPI
        type: boolean
        default: true
      rust:
        description: Publish the Rust SDK + CLI to crates.io
        type: boolean
        default: true
      bump:
        description: Version bump (current = publish the version the files already carry)
        type: choice
        default: patch
        options: [patch, minor, major, current]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Bump, commit and tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Require at least one target
        if: ${{ !inputs.typescript && !inputs.python && !inputs.rust }}
        run: |
          echo "::error::Select at least one SDK to release."
          exit 1
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - id: bump
        run: echo "version=$(node sdk/bump-versions.mjs ${{ inputs.bump }})" >> "$GITHUB_OUTPUT"
      - name: Check every file is at the new version
        run: node sdk/bump-versions.mjs --check "${{ steps.bump.outputs.version }}"
      - name: Refuse a version a selected registry already has
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          taken=0
          if [ "${{ inputs.typescript }}" = "true" ] && [ -n "$(npm view "@tinyhumansai/openintents@$VERSION" version 2>/dev/null)" ]; then
            echo "::error::npm already has @tinyhumansai/openintents $VERSION"; taken=1
          fi
          if [ "${{ inputs.python }}" = "true" ] && [ "$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/openintents/$VERSION/json")" = "200" ]; then
            echo "::error::PyPI already has openintents $VERSION"; taken=1
          fi
          if [ "${{ inputs.rust }}" = "true" ] && [ "$(curl -s -o /dev/null -w '%{http_code}' -A 'openintents-release (https://github.com/tinyhumansai/openintents)' "https://crates.io/api/v1/crates/openintents/$VERSION")" = "200" ]; then
            echo "::error::crates.io already has openintents $VERSION"; taken=1
          fi
          exit $taken
      - name: Refresh Cargo.lock
        run: cargo update -p openintents --manifest-path sdk/rust/Cargo.toml
      - id: commit
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git commit -am "chore(release): v$VERSION"
            git push origin HEAD:main
          fi
          if ! git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            git tag "v$VERSION"
            git push origin "v$VERSION"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  npm:
    name: npm
    needs: prepare
    if: ${{ inputs.typescript }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tinyhumansai/openintents test
      - run: pnpm --filter @tinyhumansai/openintents build
      - run: npm publish --access public --provenance
        working-directory: sdk/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    name: PyPI
    needs: prepare
    if: ${{ inputs.python }}
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: astral-sh/setup-uv@v7
      - run: uv run --extra dev pytest
        working-directory: sdk/python
      - run: uv build
        working-directory: sdk/python
      - run: uv publish dist/*
        working-directory: sdk/python
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

  crates:
    name: crates.io
    needs: prepare
    if: ${{ inputs.rust }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --features cli
        working-directory: sdk/rust
      - run: cargo publish --locked
        working-directory: sdk/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  verify:
    name: One version on every registry
    needs: [prepare, npm, pypi, crates]
    if: ${{ inputs.typescript && inputs.python && inputs.rust }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: npm view, pip index versions and cargo search show the new version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # Registries take a little while to show a new release.
          for attempt in $(seq 1 20); do
            npm_v=$(npm view @tinyhumansai/openintents version 2>/dev/null || true)
            pypi_v=$(uvx pip index versions openintents 2>/dev/null | sed -n '1s/^openintents (\(.*\)).*/\1/p' || true)
            crates_v=$(cargo search openintents --limit 5 2>/dev/null | sed -n 's/^openintents = "\([^"]*\)".*/\1/p' || true)
            echo "attempt $attempt: npm=$npm_v pypi=$pypi_v crates.io=$crates_v (want $VERSION)"
            if [ "$npm_v" = "$VERSION" ] && [ "$pypi_v" = "$VERSION" ] && [ "$crates_v" = "$VERSION" ]; then
              exit 0
            fi
            sleep 30
          done
          echo "::error::The registries do not all report $VERSION"
          exit 1
