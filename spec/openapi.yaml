openapi: 3.1.0
info:
  title: OpenIntents API
  version: 1.0.0-preview
  summary: The agentic API to buy anything.
  description: |
    Send an intent in plain language; the API does the agentic work in a real
    browser, gets it paid (from your agent balance, or with a payment link) and
    resolves to a structured receipt.

    Each payer (your account, or one of its customers) has a browser profile
    that keeps their merchant logins between intents. Profiles and sessions
    let you see that profile, sign in to a merchant with it, and follow the
    browser while it works.

    **Preview.** This spec describes the API as it is being built. Endpoints
    and payloads may change before launch.

    Conventions:
    - Amounts are integers in the smallest currency unit (cents for USD).
    - Timestamps are ISO 8601 in UTC.
    - `POST` operations that list an `Idempotency-Key` parameter honour it.
    - Lists are cursor-paginated (`limit`, `cursor`, `next_cursor`).
    - Request bodies are JSON objects. Unknown fields are refused
      (`400 invalid_request`), and so is an unknown `customer`, with
      `param: customer`.
    - Test and live keys work on the same customers, intents, balances and
      profiles; `test` on an intent or a session says which kind of key made
      it. Only live keys move money.
    - Event streams are Server-Sent Events: send `Accept: text/event-stream`.
    - Every request with a valid key counts against a limit of 600 a minute
      for a live key and 300 for a test key (also the burst), shown in the
      `RateLimit-Limit`, `RateLimit-Remaining` and `RateLimit-Reset` headers.
      Past it the answer is `429` with `code: rate_limit_exceeded` and
      `Retry-After`; every other `429` carries `Retry-After` too.
    - Hold a request until an intent settles with `Prefer: wait=N` (see
      `POST /intents`), instead of polling.
    - A browser goes out from a `country` (ISO 3166-1 alpha-2, lowercase,
      such as `gb`). Name it when you create an intent, session, sign-in link
      or portal session, or give the payer's own address as `end_user_ip` to
      have it inferred; else the country the payer last browsed from, else a
      default. The object says which: `country` and `country_source`.
    - Expect new fields, new enum values and new event types; ignore the ones
      you don't know.
  license:
    name: GPL-3.0-or-later
    url: https://www.gnu.org/licenses/gpl-3.0.html
  contact:
    url: https://openintents.io/docs
servers:
  - url: https://api.openintents.io/v1
security:
  - bearerAuth: []

paths:
  /intents:
    post:
      operationId: createIntent
      summary: Create an intent
      description: |
        Starts the work and returns at once, usually `queued`. With
        `Prefer: wait=N` it is held until the intent has something to tell
        you (see the header), so a short purchase can be one call; a retry
        with the same `Idempotency-Key` waits too.

        `webhook_url`, when sent, names a URL that receives this intent's
        events as well as your endpoints'. The response alone carries its
        `webhook_secret`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/PreferWait"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIntentParams"
      responses:
        "201":
          description: The intent, usually `queued`. With `webhook_url`, also its `webhook_secret`.
          headers:
            Preference-Applied:
              $ref: "#/components/headers/Preference-Applied"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Intent"
        "422":
          description: "`country_unavailable` (`param: country`): no browser can go out from the country."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          $ref: "#/components/responses/RateLimited"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    get:
      operationId: listIntents
      summary: List intents
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/IntentStatus"
        - name: customer
          in: query
          description: Only intents bought for this customer.
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of intents, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentList"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /intents/{id}:
    get:
      operationId: getIntent
      summary: Retrieve an intent
      description: "With `Prefer: wait=N`, held until the intent settles or `N` seconds pass."
      parameters:
        - $ref: "#/components/parameters/IntentId"
        - $ref: "#/components/parameters/PreferWait"
      responses:
        "200":
          description: The intent.
          headers:
            Preference-Applied:
              $ref: "#/components/headers/Preference-Applied"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Intent"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /intents/{id}/cancel:
    post:
      operationId: cancelIntent
      summary: Cancel an intent that has not paid yet
      parameters:
        - $ref: "#/components/parameters/IntentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The cancelled intent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Intent"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /intents/{id}/input:
    post:
      operationId: answerIntentInput
      summary: Answer what an intent asks its payer for
      description: |
        Answers the intent's `input_request` while it waits in
        `requires_input`: the phone number, email, code or answer to a
        `detail` in `value`, `decline` when the payer would rather not (the
        agent stops asking, see `InputRequest`), or `done` once they
        approved an `approval` or paid a `payment`. A question with `choices` is answered with
        the `id` of one in `value`, and one with `fields` with `values`, an
        object of the answers by field `name`. Send exactly one of
        `value`, `values`, `decline` and `done`, with the request's `id` as
        `input`. The intent usually goes back to `running`.

        A question of `kind: sensitive` (an identity document) cannot be
        answered here: only the payer, on its `url`, which keeps the document
        in your account's secrets. Declining is allowed; any other answer is
        `422 answer_on_page`.

        OpenIntents types a phone number, email or code into the shop's page
        itself: the agent's model never sees it. It is sealed until then and
        deleted once typed, and no read, event, webhook or log returns it. A
        `detail` is no secret: its answer goes back to the agent, which uses
        it as it would the request's own context.
      parameters:
        - $ref: "#/components/parameters/IntentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerInputParams"
      responses:
        "200":
          description: The intent, usually `running` again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Intent"
        "400":
          description: |
            `invalid_request`: a `value` that does not fit the request's
            `kind`, or is not one of a `detail`'s `options`, a form with a
            required field missing or a value of the wrong type (`param`
            names the field, never the value), or not exactly one of
            `value`, `values`, `decline` and `done`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "422":
          description: |
            `unknown_option`: an `id` the question never offered (`param` is
            `value` or `values`), or `answer_on_page`: the question wants an
            identity document, which is answered on its `url` only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: "`not_found`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: |
            `input_not_waiting`: the request was already answered or
            expired, or the intent moved on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /intents/{id}/events:
    get:
      operationId: listIntentEvents
      summary: Follow an intent's progress
      description: |
        The intent's timeline, oldest first: status changes, the agent's
        steps, and its checkout (see `Event`). `limit` and `cursor` page the
        JSON list. With `Accept: text/event-stream` the response is a live
        stream instead (see `EventStream`), resumed with `Last-Event-ID`.
      parameters:
        - $ref: "#/components/parameters/IntentId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/LastEventId"
      responses:
        "200":
          description: A page of events, or the live stream.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
            text/event-stream:
              schema:
                $ref: "#/components/schemas/EventStream"
        "204":
          description: |
            A stream of something that is over, with nothing left to send
            (asked to resume after its last event, say): SSE clients stop
            reconnecting.
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /balance:
    get:
      operationId: getBalance
      summary: Get the agent balance
      parameters:
        - name: customer
          in: query
          description: A customer's balance instead of your account's.
          schema:
            type: string
      responses:
        "200":
          description: The balance intents pay from.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Balance"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /customers:
    post:
      operationId: createCustomer
      summary: Create a customer
      description: |
        Someone you buy for. A customer has their own balance and their own
        browser profile; pass `customer` when creating an intent. An
        `external_id` already in use answers `409 conflict`. `limits` caps
        what they may spend.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        description: Send `{}` for a customer with no details yet.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerParams"
      responses:
        "201":
          description: The customer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    get:
      operationId: listCustomers
      summary: List customers
      parameters:
        - name: external_id
          in: query
          description: Only the customer with this `external_id`.
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of customers, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerList"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /customers/{id}:
    get:
      operationId: getCustomer
      summary: Retrieve a customer
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      responses:
        "200":
          description: The customer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateCustomer
      summary: Update a customer
      description: |
        Fields left out stay as they are. An empty string clears
        `external_id`, `name` or `email`. `metadata`, when given, replaces the
        whole map: send every pair to keep, or `{}` to clear it.
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerParams"
      responses:
        "200":
          description: The updated customer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /topups:
    post:
      operationId: createTopup
      summary: Top up a balance
      description: |
        A payment link that adds `amount` to your account's balance, or a
        customer's, once paid. Needs a live key: a test key answers
        `400 invalid_request` (`live_key_required`).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTopupParams"
      responses:
        "201":
          description: The top-up, `open` until paid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topup"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /topups/{id}:
    get:
      operationId: getTopup
      summary: Retrieve a top-up
      parameters:
        - $ref: "#/components/parameters/TopupId"
      responses:
        "200":
          description: The top-up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topup"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /profiles:
    get:
      operationId: listProfiles
      summary: List browser profiles
      description: |
        Your account's profile and your customers' that exist so far, newest
        first.
      parameters:
        - name: customer
          in: query
          description: Only this customer's profile.
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of profiles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileList"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createProfile
      summary: Create a browser profile
      description: |
        Makes the profile for your account, or for `customer`, ahead of its
        first intent or session. An intent makes the profile it needs by
        itself, so this is optional. Making one that exists returns it
        unchanged, with `200`.
      requestBody:
        required: true
        description: Send `{}` for your account's own profile.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProfileParams"
      responses:
        "201":
          description: The profile, made now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "200":
          description: The profile, which already existed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /profiles/{id}:
    get:
      operationId: getProfile
      summary: Retrieve a browser profile
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteProfile
      summary: Forget a browser profile
      description: |
        Erases everything the profile kept: logins, cookies, saved data. It
        shows `forgetting` until that is done, also while an intent or a
        session still finishes with it, then `forgotten`; the next one starts
        from an empty profile. Forgetting twice is fine.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "202":
          description: The profile, `forgetting`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /sessions:
    post:
      operationId: createSession
      summary: Open a browser session
      description: |
        Opens a browser on a profile, without an intent: to sign in to a
        merchant once, so later intents find the payer signed in, or to look
        at what the profile holds. Drive it with commands, follow it with
        events, and release it when done; the profile keeps what the session
        changed.

        A profile is used by one intent or session at a time. If one is using
        it, or it is `forgetting`, this answers `409 conflict`
        (`profile_busy`), and the error's `lease` says what uses it and when
        its lease next runs out. A profile is free while its intent waits in
        `requires_payment`: a session opened then can change the cart that
        intent resumes with. An intent that waits in `requires_input` still
        uses its profile, and while one waits in `requires_login`, its
        payer's sign-in may be using it.

        A session never enters payment details (see `SessionCommand`). Test
        and live keys can both open one.

        Sessions may not be open to every key yet. Until they are open to
        yours, this answers `503` with `code: sessions_unavailable` and
        creates nothing; a retry with the same `Idempotency-Key` opens the
        session once they are. Sessions already open keep working.

        `country`, `end_user_ip` and `webhook_url` work as on an intent. A
        `country` no browser can go out from is `422 country_unavailable`.

        Limits, which may change: a session closes `max_minutes` after it
        opens, after 5 minutes with no command sent or run (`idle`;
        screenshots and event streams do not count), or once its pages use
        more data than a session may (`data_limit`). An account can have 2
        sessions that have not ended (`queued`, `opening`, `open` or
        `closing`) at once (`session_limit`).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        description: Send `{}` to open your account's own profile on a blank page.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionParams"
      responses:
        "201":
          description: The session, `queued` or `opening`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "409":
          description: "`profile_busy` (with the `lease`) or `session_limit`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: "`sessions_unavailable`: sessions are not open to this key yet. Nothing was created."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    get:
      operationId: listSessions
      summary: List browser sessions
      description: Newest first.
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/SessionStatus"
        - name: profile
          in: query
          schema:
            type: string
        - name: customer
          in: query
          description: Only sessions on this customer's profile.
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /sessions/{id}:
    get:
      operationId: getSession
      summary: Retrieve a browser session
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /sessions/{id}/commands:
    post:
      operationId: runSessionCommand
      summary: Run a command in a session
      description: |
        Runs one command on the session's current page and waits for it, up
        to 20 seconds. One that takes longer answers `202` while still
        `pending`: fetch it again by its `id`. Commands run one at a time, in
        the order sent; one sent while another is `pending` waits its turn. A
        retry with the same `Idempotency-Key` returns the same command instead
        of running it again. The session must be `open`
        (`409 session_not_open`).

        A command that breaks the rules of its fields answers `400`: a `text`
        with a control character other than a line break, or a `key` that is
        not one key, alone or with only Shift or Control. One the page does
        not allow comes back `refused` or `failed`, with the reason in
        `error` (see `SessionCommand`, `ActCommand` and `Failure`).
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCommand"
      responses:
        "200":
          description: The command, `done`, `refused` or `failed`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCommandResult"
        "202":
          description: The command, still `pending`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCommandResult"
        "409":
          description: "`session_not_open`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /sessions/{id}/commands/{command_id}:
    get:
      operationId: getSessionCommand
      summary: Retrieve a session command
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: command_id
          in: path
          required: true
          schema:
            type: string
            examples: [cmd_51f0e2]
      responses:
        "200":
          description: The command.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCommandResult"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /sessions/{id}/screenshot:
    get:
      operationId: getSessionScreenshot
      summary: See a session's page
      description: |
        A screenshot of the session's page, taken now, as a JPEG whatever
        `Accept` says. It shows the payer's signed-in pages, so it is never
        cached. The session must be `open` (`409 session_not_open`). At most
        2 screenshots of a session may wait at once: one more answers `429`
        with `code: too_many_commands`.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: The page.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            image/jpeg:
              schema:
                type: string
                contentMediaType: image/jpeg
        "409":
          description: "`session_not_open`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: "`too_many_commands`: 2 screenshots of this session already wait."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /sessions/{id}/release:
    post:
      operationId: releaseSession
      summary: Release a session
      description: |
        Closes the browser and keeps what the session changed in the profile:
        `closing`, then `closed` (`released`). A session still `queued` or
        `opening` closes the same way; one already `closed` or `failed` is
        returned unchanged.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /sessions/{id}/events:
    get:
      operationId: listSessionEvents
      summary: Follow a session
      description: |
        The session's timeline, oldest first: status changes, pages and
        commands (see `Event`). `limit` and `cursor` page the JSON list. With
        `Accept: text/event-stream` the response is a live stream instead
        (see `EventStream`), resumed with `Last-Event-ID`.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/LastEventId"
      responses:
        "200":
          description: A page of events, or the live stream.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
            text/event-stream:
              schema:
                $ref: "#/components/schemas/EventStream"
        "204":
          description: |
            A stream of something that is over, with nothing left to send
            (asked to resume after its last event, say): SSE clients stop
            reconnecting.
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /customers/{id}/portal_sessions:
    post:
      operationId: createPortalSession
      summary: Give a customer a link to their own page
      description: |
        Makes a link to a page where one of your customers sees and manages
        their own browser: the shops they are signed in to, signing in to
        another, opening their browser to look around, and having their
        profile forgotten. You send them the link; they need no OpenIntents
        account and no API key.

        `url` is theirs alone and works once, for 30 minutes (or `ttl_seconds`
        if that is shorter); opening it starts a session for that customer
        that lasts `ttl_seconds` (default 8 hours). Each call makes a new
        link. It takes no `Idempotency-Key`, since the link is shown once and
        is not kept in a stored response.

        The country the customer's browser goes out from is chosen as for an
        intent (see `country`).

        Portal sessions may not be open to every key yet. Until they are open
        to yours, this answers `503` with `code: portal_unavailable` and makes
        nothing.
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      requestBody:
        required: true
        description: Send `{}` for the defaults.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePortalSessionParams"
      responses:
        "201":
          description: The portal session.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalSession"
        "404":
          description: "`not_found`: no such customer in your account."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "422":
          description: "`country_unavailable` (`param: country`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: "`portal_unavailable`: portal sessions are not open to this key yet. Nothing was made."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /customers/{id}/secret_requests:
    post:
      operationId: createSecretRequest
      summary: Ask a customer to enter their own secrets
      description: |
        Makes a link to a page where the customer types their own secrets
        (see `Secret`): an address, a contact, a card and the like. What they
        enter goes straight into the vault, so it never passes through your
        code, your agent or its model. You get the handles of what they made
        by reading the request, or from the `secret_request.completed`
        webhook.

        `url` is theirs alone and works once, until `expires_at`. It takes no
        `Idempotency-Key`, since the link is the capability and is not kept in
        a stored response. The secrets made are the customer's own, in the
        mode of the key that made the request, with `entered_by: payer`.

        Answers `503` with `code: secrets_unavailable` when secrets cannot be
        stored right now, and with `code: cards_unavailable` when `kinds`
        asks for a `card` and cards cannot be taken.
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSecretRequestParams"
      responses:
        "201":
          description: The request, `pending`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretRequestCreated"
        "404":
          description: "`not_found`: no such customer in your account."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: "`secrets_unavailable` or `cards_unavailable`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /secret_requests/{id}:
    get:
      operationId: getSecretRequest
      summary: Retrieve a secret request
      description: |
        Where the request stands and, once the customer filled it in, the
        handles of the secrets it made. Never a value, a mask or the link.
        Read it with a key of the mode that made it.
      parameters:
        - $ref: "#/components/parameters/SecretRequestId"
      responses:
        "200":
          description: The request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretRequest"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /secrets:
    post:
      operationId: createSecret
      summary: Store a secret
      description: |
        Stores details a purchase may need and that you would not put in a
        prompt: an address, a contact, a card, an identity document, a shop
        login or a loyalty number. Secrets are write-only. The values are
        sealed on arrival and no call, event, webhook or log returns them; a
        secret comes back as its `label`, a `mask` and the few `public` fields
        its kind has. The agent is told that a secret exists, never what it
        holds, and OpenIntents types the values into a shop's page itself.

        `kind` says which `fields` are taken (see `SecretKind`); a field a
        kind does not have is refused, and an error names the field and the
        rule, never the value sent. A secret belongs to one payer, your
        account or one of its `customer`s, and to the mode of the key that
        wrote it: a test key never sees a live secret. A body may weigh at
        most 16 KB (`413`), and a payer may have 50 secrets in a mode.

        A write counts against 60 a minute for the key; past that the answer
        is `429` with `code: too_many_writes` and `Retry-After`. Answers `503`
        with `code: secrets_unavailable` when secrets cannot be stored right
        now. A retry with the same `Idempotency-Key` and the same body returns
        the first result; the same key with another body is
        `409 idempotency_key_reused`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSecretParams"
      responses:
        "201":
          description: The secret, without its values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Secret"
        "413":
          description: The body is over 16 KB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: "`too_many_writes`, with `Retry-After`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: "`secrets_unavailable`. Nothing was stored."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    get:
      operationId: listSecrets
      summary: List secrets
      description: |
        A payer's secrets in the key's mode, without their values: your
        account's, or a customer's with `customer`.
      parameters:
        - name: customer
          in: query
          description: A customer's secrets instead of your account's.
          schema:
            type: string
        - name: kind
          in: query
          description: Only secrets of this kind.
          schema:
            $ref: "#/components/schemas/SecretKind"
      responses:
        "200":
          description: The secrets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretList"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /secrets/{id}:
    get:
      operationId: getSecret
      summary: Retrieve a secret
      description: Its label, mask and public fields; never its values.
      parameters:
        - $ref: "#/components/parameters/SecretId"
      responses:
        "200":
          description: The secret, without its values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Secret"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: replaceSecret
      summary: Replace a secret
      description: |
        Writes the whole secret again: a new `version`, the old values gone.
        There is no partial update, so send every field. The body is the one
        of `POST /secrets`; it may repeat the `customer` but not move the
        secret to another. Counts against the same 60 writes a minute, and
        honours `Idempotency-Key` as a create does.
      parameters:
        - $ref: "#/components/parameters/SecretId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSecretParams"
      responses:
        "200":
          description: The secret, without its values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Secret"
        "413":
          description: The body is over 16 KB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: "`too_many_writes`, with `Retry-After`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: "`secrets_unavailable`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteSecret
      summary: Delete a secret
      description: Erases its values. Its history (see `GET /secrets/{id}/uses`) stays readable.
      parameters:
        - $ref: "#/components/parameters/SecretId"
      responses:
        "204":
          description: Deleted.
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /secrets/{id}/uses:
    get:
      operationId: listSecretUses
      summary: See what was done with a secret
      description: |
        The secret's history, newest first: when it was written, replaced or
        deleted, and each time a value was typed into a shop, was used to
        fund a balance, or a use was refused. Never a value or a mask. A
        deleted secret's history stays readable.
      parameters:
        - $ref: "#/components/parameters/SecretId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of uses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretUseList"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /sessions/{id}/live_links:
    post:
      operationId: createLiveLink
      summary: Get a link to watch and drive a session
      description: |
        Makes a link to a page that shows the session's browser live. Whoever
        holds `url` sees the browser and drives it: taps, scrolls and typing.
        Each call makes a new link, valid for 10 minutes and for this one
        session while it is open. Send no body.

        What is done through it is checked as a session command's `act` is: a
        control that places an order or pays is refused with
        `payment_not_allowed`, and a page off the web a session may reach with
        `not_allowed`. The session must be `open` (`409 session_not_open`).

        A live view may not be open to every key yet. Until it is open to
        yours, this answers `503` with `code: live_unavailable` and makes
        nothing.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "201":
          description: The link, shown once.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveLink"
        "409":
          description: "`session_not_open`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: "`live_unavailable`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /sign_ins:
    post:
      operationId: createSignIn
      summary: Get a payer a link to sign in to a shop
      description: |
        Makes a link to a page where the payer signs in to a shop, with no
        intent attached ("connect your account"). They see the shop's own
        sign-in page in a browser OpenIntents runs on their profile, which
        never pays, places orders or enters card details. When they are done,
        the profile keeps the login, so later intents find them signed in.

        `url` is for the payer only: it works on the first device that opens
        it, until `expires_at`. Follow the link's `status`, or take the
        `sign_in.completed` and `sign_in.expired` webhooks (sent only to
        endpoints that name them).

        `403 shop_not_allowed` when links are not made for the shop. Answers
        `503` with `code: sign_ins_unavailable` when sign-in links are not
        open to your key yet; nothing is made, and a retry with the same
        `Idempotency-Key` makes the link once they are.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSignInParams"
      responses:
        "201":
          description: The link, `open`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignIn"
        "403":
          description: "`shop_not_allowed`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "422":
          description: "`country_unavailable` (`param: country`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: "`sign_ins_unavailable`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /sign_ins/{id}:
    get:
      operationId: getSignIn
      summary: Retrieve a sign-in link
      parameters:
        - $ref: "#/components/parameters/SignInId"
      responses:
        "200":
          description: The sign-in link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignIn"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /webhook_endpoints:
    post:
      operationId: createWebhookEndpoint
      summary: Add a webhook endpoint
      description: |
        Registers a URL that receives your account's events, signed with a
        secret made for it. The secret (`secret`, `whsec_...`) is in this
        response and in a rotation's only: keep it. An account can have 16
        endpoints. `url` must be `https` on the default port and resolve to a
        public address.

        An endpoint with no `events` gets every intent event
        (`intent.*`); name `session.*`, `sign_in.*` or `secret_request.*`
        types to get those too.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWebhookEndpointParams"
      responses:
        "201":
          description: The endpoint, with its `secret`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpoint"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    get:
      operationId: listWebhookEndpoints
      summary: List webhook endpoints
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of endpoints, newest first. Their secrets are not shown.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpointList"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /webhook_endpoints/{id}:
    get:
      operationId: getWebhookEndpoint
      summary: Retrieve a webhook endpoint
      parameters:
        - $ref: "#/components/parameters/WebhookEndpointId"
      responses:
        "200":
          description: The endpoint, without its secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpoint"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateWebhookEndpoint
      summary: Update a webhook endpoint
      description: |
        Fields left out stay as they are. `events: []` goes back to every
        intent event. A disabled endpoint receives nothing new.
      parameters:
        - $ref: "#/components/parameters/WebhookEndpointId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWebhookEndpointParams"
      responses:
        "200":
          description: The endpoint, without its secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpoint"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteWebhookEndpoint
      summary: Delete a webhook endpoint
      parameters:
        - $ref: "#/components/parameters/WebhookEndpointId"
      responses:
        "204":
          description: Deleted.
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /webhook_endpoints/{id}/rotate_secret:
    post:
      operationId: rotateWebhookEndpointSecret
      summary: Rotate an endpoint's signing secret
      description: |
        Makes a new `secret`, returned here only. The one before keeps
        signing for 24 hours (`previous_secret_expires_at`): while it does,
        each delivery's `OpenIntents-Signature` carries a `v1` for each
        secret (`t=...,v1=...,v1=...`), and a receiver that accepts either
        can switch over without dropping an event.
      parameters:
        - $ref: "#/components/parameters/WebhookEndpointId"
      responses:
        "200":
          description: The endpoint, with its new `secret`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpoint"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /webhook_endpoints/{id}/test:
    post:
      operationId: testWebhookEndpoint
      summary: Send a test event to an endpoint
      description: |
        Queues a `webhook_endpoint.test` event (see `WebhookTestEvent`) for
        this endpoint alone, so you can check your receiver and signature
        code. The delivery shows how it goes. `409 conflict` while the
        endpoint is disabled.
      parameters:
        - $ref: "#/components/parameters/WebhookEndpointId"
      responses:
        "201":
          description: The delivery, `pending`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDelivery"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /webhook_endpoints/{id}/deliveries:
    get:
      operationId: listWebhookDeliveries
      summary: See an endpoint's deliveries
      description: |
        What was sent to the endpoint, newest first: whether each arrived, how
        many attempts it took and what your receiver answered. Deliveries to
        an intent's or a session's own `webhook_url` are not in any log.
      parameters:
        - $ref: "#/components/parameters/WebhookEndpointId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of deliveries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDeliveryList"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /webhook_endpoints/{id}/deliveries/{delivery}/redeliver:
    post:
      operationId: redeliverWebhook
      summary: Send a delivery again
      description: |
        Queues a new delivery with the same event `id` and body. `409
        conflict` while the original is still `pending`, or while the endpoint
        is disabled.
      parameters:
        - $ref: "#/components/parameters/WebhookEndpointId"
        - name: delivery
          in: path
          required: true
          schema:
            type: string
            examples: [whd_8f2c41d0a9e7b3f15c62d1aa]
      responses:
        "201":
          description: The new delivery, `pending`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDelivery"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

webhooks:
  intentEvent:
    post:
      operationId: intentEvent
      summary: An intent changed status
      description: |
        Sent to your endpoints (see `/webhook_endpoints`) for every status
        change, and to the intent's own `webhook_url` if it has one. Check the
        `OpenIntents-Signature` header before trusting the body, and respond
        with any 2xx within 10 seconds (failed deliveries are retried).
        While a secret is being rotated the header carries one `v1` for each
        secret that still signs (`t=...,v1=...,v1=...`): accept any that
        matches.
      parameters:
        - name: OpenIntents-Signature
          in: header
          required: true
          schema:
            type: string
            example: t=1700000000,v1=366e40c480fe3a9e6a03609dca079cea86d77ae82d5a56b5348208247317a8d1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEvent"
      responses:
        "200":
          description: Received.
  signInEvent:
    post:
      operationId: signInEvent
      summary: A sign-in link ended
      description: |
        Sent when a link made with `POST /sign_ins` ends: the payer signed in
        (`sign_in.completed`) or it ran out (`sign_in.expired`). Same signature
        as `intentEvent`. Only endpoints that list the type receive it.
      parameters:
        - name: OpenIntents-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInWebhookEvent"
      responses:
        "200":
          description: Received.
  secretRequestEvent:
    post:
      operationId: secretRequestEvent
      summary: A customer filled in a secret request
      description: |
        Sent when a customer finishes a request made with
        `POST /customers/{id}/secret_requests`. Same signature as
        `intentEvent`. Only endpoints that list the type receive it. It holds
        the handles of the secrets made, never a value.
      parameters:
        - name: OpenIntents-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecretRequestWebhookEvent"
      responses:
        "200":
          description: Received.
  webhookEndpointTest:
    post:
      operationId: webhookEndpointTest
      summary: A test event
      description: |
        Sent to one endpoint when you call `POST /webhook_endpoints/{id}/test`.
        Same signature as `intentEvent`.
      parameters:
        - name: OpenIntents-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookTestEvent"
      responses:
        "200":
          description: Received.
  sessionEvent:
    post:
      operationId: sessionEvent
      summary: A browser session opened, closed or failed
      description: |
        Sent when a session opens, closes, or fails (its browser was lost,
        say), with the same signature as `intentEvent`. Only endpoints
        subscribed to `session.*` types receive it: an endpoint that takes
        every type keeps getting intent events only. Dispatch on `type`
        before reading `data`.
      parameters:
        - name: OpenIntents-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionWebhookEvent"
      responses:
        "200":
          description: Received.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: An API key, `oi_live_...` or `oi_test_...`.

  parameters:
    IntentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        example: int_7f3a2c
    CustomerId:
      name: id
      in: path
      required: true
      schema:
        type: string
        example: cus_4b81d0
    ProfileId:
      name: id
      in: path
      required: true
      description: |
        Starts with `prf_`; treat it as opaque. Find a customer's profile with
        `GET /profiles?customer=`.
      schema:
        type: string
        example: prf_7c1d04e2a9b3
    TopupId:
      name: id
      in: path
      required: true
      schema:
        type: string
        example: pay_3e9b71
    SessionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        example: ses_92c4aa
    SecretId:
      name: id
      in: path
      required: true
      schema:
        type: string
        examples: [sec_9c1b7a40d3e85f26]
    SecretRequestId:
      name: id
      in: path
      required: true
      schema:
        type: string
        examples: [sr_3d71c0b8a2e94f65]
    SignInId:
      name: id
      in: path
      required: true
      schema:
        type: string
        examples: [sgn_6a20e4b19c7d3f58]
    WebhookEndpointId:
      name: id
      in: path
      required: true
      schema:
        type: string
        examples: [we_4c82a1d09b7e3f56]
    PreferWait:
      name: Prefer
      in: header
      required: false
      description: |
        `wait=N` holds the request until the intent is neither `queued` nor
        `running` (it finished, or now needs a payment, an answer or a
        sign-in), or `N` seconds pass, and then answers with the intent as it
        stands. `N` is a whole number of seconds; more than 50 is applied as
        50, and a value that is no whole number is ignored. The answer's
        `Preference-Applied: wait=N` header says what was applied. A
        `wait` that times out is no error: poll or wait again.
      schema:
        type: string
        examples: ["wait=30"]
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: With a stream, resume after this event; SSE clients send it when they reconnect.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Retrying with the same key and the same request returns the first
        successful result again, with an `Idempotent-Replayed: true` header. A
        request that failed frees its key, so a retry runs again. The same key
        with a different request answers `409 idempotency_key_reused`; while
        the first request still runs, `409 idempotency_key_in_use`.
      schema:
        type: string
        minLength: 1
        maxLength: 255

  headers:
    RateLimit-Limit:
      description: Requests a minute your key may make; also the burst.
      schema:
        type: integer
    RateLimit-Remaining:
      description: Requests left in your bucket now.
      schema:
        type: integer
    RateLimit-Reset:
      description: Seconds until your bucket is full again.
      schema:
        type: integer
    Retry-After:
      description: Whole seconds to wait before the request can pass.
      schema:
        type: integer
    Preference-Applied:
      description: "`wait=N`: the wait that was applied (see the `Prefer` header)."
      schema:
        type: string
        examples: ["wait=30"]

  responses:
    RateLimited:
      description: |
        `rate_limit_exceeded` (type `rate_limit`): your key made more requests
        than it may a minute. Wait `Retry-After` seconds. Other `429`s
        (`too_many_writes`, `too_many_commands`, `too_many_streams`) carry
        `Retry-After` too.
      headers:
        Retry-After:
          $ref: "#/components/headers/Retry-After"
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimit-Reset"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Error:
      description: An error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"

  schemas:
    IntentStatus:
      type: string
      description: |
        `requires_payment`, `requires_input` and `requires_login` wait on a
        person: the payer pays the payment link, answers what the agent asks
        (while it signs them in to the shop, or for a detail the purchase
        needs), or signs in on the sign-in link.
        `completed`, `failed` and `cancelled` are final.
      enum: [queued, running, requires_payment, requires_input, requires_login, completed, failed, cancelled]

    CreateIntentParams:
      type: object
      additionalProperties: false
      required: [intent]
      properties:
        intent:
          type: string
          maxLength: 2000
          description: What to buy or book, in natural language.
        max_amount:
          type: integer
          minimum: 1
          maximum: 1000000
          description: Spending cap in cents. The intent fails rather than exceed it.
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO currency code, kept lowercase.
        context:
          type: object
          additionalProperties: true
          description: Structured details (addresses, names, loyalty numbers), at most 16 KB as JSON.
        require_payment_link:
          type: boolean
          description: Always return a payment link instead of paying from the balance.
        sign_in_agent:
          type: boolean
          default: true
          description: |
            When the shop wants the payer signed in, and its sign-in asks for
            a phone number or an email and then a one-time code: `true` lets
            the agent sign them in itself, waiting in `requires_input` each
            time it needs something only the payer knows (see
            `InputRequest`). `false` never does: the intent uses the sign-in
            link instead, if `sign_in_link` allows, or fails with
            `login_required`. With both on, the agent tries first and the
            sign-in link is the fallback. It takes effect only where
            OpenIntents has agent sign-in on for your key. Shops that need a
            password always use the sign-in link. Where it is on, the agent
            may also ask the payer for a `detail` the purchase needs, in the
            same way.
        pay_at_shop:
          type: boolean
          default: false
          description: |
            `true`: the payer pays the shop themselves. At the payment step
            the intent waits in `requires_input` with a `payment` request
            whose `image_url` is a picture of the shop's own payment code (a
            UPI QR code); the payer scans it in their own app and you answer
            `done` once they paid, or they tap the button on `url`. The order
            then goes through, and only the fee comes from your balance (none
            when the intent's currency is not your balance's). Live keys only:
            a test key's intent stops at the payment step as always. Where it
            is not available for your key, creating the intent is
            `503 pay_at_shop_unavailable`.
        sign_in_hint:
          type: object
          additionalProperties: false
          description: |
            The payer's phone number or email for signing in, so the agent
            need not ask for it. It is kept sealed, used once, deleted when
            the intent ends, and never returned.
          properties:
            phone:
              type: string
              description: Digits, with an optional leading `+`; spaces, dashes, dots and parentheses are fine.
            email:
              type: string
        sign_in_link:
          type: boolean
          default: true
          description: |
            When the shop wants the payer signed in and the agent does not
            sign them in itself (see `sign_in_agent`): `true` waits in
            `requires_login` with a sign-in link for them; `false` fails the
            intent with `login_required`, for callers who sign payers in
            themselves with sessions.
        customer:
          type: string
          description: |
            A customer of your account to buy for. The intent uses their
            balance and their browser profile. Without it, your account's own.
        metadata:
          $ref: "#/components/schemas/MetadataParam"
        country:
          type: string
          pattern: "^[a-z]{2}$"
          description: |
            Where the payer's browser goes out from, ISO 3166-1 alpha-2 in
            lowercase (`gb`, not `uk`). Without it: the country the payer last
            browsed from, else the country of `end_user_ip`, else the default.
            `422 country_unavailable` (`param: country`) when no browser can
            go out from it, `400` when it is malformed.
        end_user_ip:
          type: string
          description: |
            The payer's own IP address, so their country can be inferred:
            your server's address says nothing of where they are. Not stored.
            A private address is ignored; a malformed one is `400`.
        webhook_url:
          type: string
          format: uri
          description: |
            A URL that receives this intent's events (`intent.*`) as well as
            your endpoints', signed with a secret made for the intent and
            returned once, as `webhook_secret`, in this create response. `https`
            on the default port, resolving to a public address; `400` naming
            `webhook_url` otherwise.
        input_ttl_seconds:
          type: integer
          minimum: 60
          maximum: 86400
          default: 86400
          description: |
            How long a question the agent asks the payer (`requires_input`)
            may wait for its answer once it stops waiting with a browser open
            (after about 2 minutes): then the intent stays `requires_input`,
            its `input_request.expires_at` the time it gives up, and an answer
            lets it carry on. After that it fails with `input_expired`.
        secrets:
          type: array
          items:
            type: string
          description: |
            Handles (`sec_...`) of the payer's secrets the purchase may use.
            Without it, it may use the payer's defaults; `[]` offers none. A
            handle that is not the payer's own, in the key's mode, is `404`
            with `param: secrets`.
        shops:
          type: array
          items:
            type: string
          description: |
            Shops (domains) you let the purchase fill secrets on. `["*"]` lets
            it fill address and contact secrets on any shop it reaches.

    Intent:
      type: object
      required: [id, object, status, intent, customer, currency, metadata, webhook_url, secrets, shops, country, country_source, test, created_at]
      properties:
        id:
          type: string
        object:
          type: string
          const: intent
        status:
          $ref: "#/components/schemas/IntentStatus"
        intent:
          type: string
        customer:
          type: [string, "null"]
          description: The customer it buys for; `null` for your account's own intents.
        max_amount:
          type: [integer, "null"]
        currency:
          type: string
        context:
          type: [object, "null"]
          additionalProperties: true
        metadata:
          type: object
          additionalProperties:
            type: string
        payment:
          oneOf:
            - $ref: "#/components/schemas/PaymentRequest"
            - type: "null"
        sign_in:
          description: Set while `requires_login`.
          oneOf:
            - $ref: "#/components/schemas/SignInRequest"
            - type: "null"
        input_request:
          description: Set while `requires_input`.
          oneOf:
            - $ref: "#/components/schemas/InputRequest"
            - type: "null"
        webhook_url:
          type: [string, "null"]
          format: uri
          description: Where this intent's own events go, if it was created with a `webhook_url`.
        webhook_secret:
          type: string
          description: The secret that signs the `webhook_url` deliveries (`whsec_...`). Only in the create response.
        secrets:
          type: [array, "null"]
          items:
            type: string
          description: |
            The handles of the secrets the purchase may use, as given;
            `null` when none were named (the payer's defaults apply). Never a
            value.
        shops:
          type: array
          items:
            type: string
          description: The shops you let the purchase fill secrets on.
        result:
          oneOf:
            - $ref: "#/components/schemas/Receipt"
            - type: "null"
        error:
          oneOf:
            - $ref: "#/components/schemas/IntentError"
            - type: "null"
        test:
          type: boolean
        country:
          type: [string, "null"]
          description: The country its browser goes out from.
        country_source:
          oneOf:
            - $ref: "#/components/schemas/CountrySource"
            - type: "null"
        created_at:
          type: string
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time

    PaymentRequest:
      type: object
      required: [reason, payment_url, total, fee, currency, expires_at]
      properties:
        reason:
          type: string
          enum: [insufficient_balance, over_limit, requested]
        payment_url:
          type: string
          format: uri
        merchant:
          type: [string, "null"]
        total:
          type: integer
        fee:
          type: integer
        currency:
          type: string
        expires_at:
          type: string
          format: date-time

    SignInRequest:
      type: object
      description: |
        Where the payer signs in to a shop, so a waiting intent carries on.
        Send `url` to the payer only, and don't open it yourself: it works for
        30 minutes, on the first device that opens it, and any other device
        sees only that it is in use, unless the first one leaves it alone for
        a few minutes. They see the shop's own sign-in page, in
        their browser that OpenIntents runs, which never pays, places orders
        or enters card details. Once they sign in, the intent goes back to
        `queued` (reason `signed_in`); if they decline or the link expires,
        it fails with `login_required`. Nothing is charged either way.
      required: [url, shop, expires_at]
      properties:
        url:
          type: string
          format: uri
        shop:
          type: string
          description: The shop's domain, such as `amazon.com`.
        expires_at:
          type: string
          format: date-time

    InputRequest:
      type: object
      description: |
        What the agent needs from the payer while it signs them in to a shop
        itself (see `sign_in_agent`), or a `detail` the purchase needs that
        the request did not give. Ask the payer `prompt` and answer with
        `POST /intents/{id}/input` right away, or send them `url` so they
        type the answer there and it never passes through your chat. The
        agent never asks for a password this way.

        A `detail` comes with the same `requires_input` status and
        `intent.requires_input` webhook, and an intent asks at most 3.
        A sign-in question expires after 5 minutes. If it expires, or the
        payer declines, the agent stops asking: the intent then waits on a
        sign-in link (`requires_login`) if `sign_in_link` allows, or fails
        with `login_required`. A `detail` the payer has not answered after
        about 2 minutes is parked: the intent stays `requires_input` with the
        same request, whose `expires_at` becomes the time it gives up (see
        `input_ttl_seconds`), and an answer lets the purchase carry on. It
        fails with `needs_information` when the payer declines and with
        `input_expired` when no answer comes in time.

        A `detail` can offer `choices` (each with an `id`, answered by that
        id) or ask a form of `fields` (answered with `values`); `expects`
        says what a plain answer must look like.
      required: [id, kind, shop, prompt, options, choices, fields, expects, channel, length, url, expires_at, attempts_left]
      properties:
        id:
          type: string
          description: Answer with this ID.
          examples: [inp_8f2c41d0a9e7b3f15c62d1aa]
        kind:
          type: string
          description: |
            What the agent needs: the payer's `phone` number or `email` to
            sign in with, a one-time `code` the shop sent them, or their
            `approval` of the sign-in, in the shop's app or in a notification
            on another device. An `approval` has no value: answer `done` once
            they approved it.

            `detail`: anything else the purchase needs that the request did
            not give, such as the email the shop wants for the order, a size
            or a colour. `prompt` is then the agent's own question (never
            asking for passwords, codes, PINs, card or bank details or ID
            numbers), and the answer goes back to the agent.

            `sensitive`: an identity document (a passport for a flight, a
            licence for a rental). It is answered only on `url`, where the
            payer enters it and it is kept as one of your account's secrets
            bound to the shop; the request has no `choices` or `fields`, and
            the answer is never returned. `POST /intents/{id}/input` refuses
            any answer but a decline (`422 answer_on_page`).

            `payment`: the payer pays the shop themselves (`pay_at_shop`).
            `image_url` is a picture of the shop's payment code to scan with
            a UPI app, and `prompt` names the amount. Answer `done` once they
            paid, or `decline`; it takes no value. It expires after 5
            minutes, and the agent may show a fresh code once more.
          enum: [phone, email, code, approval, detail, sensitive, payment]
        shop:
          type: string
          description: The shop's registrable domain, such as `blinkit.com`.
        prompt:
          type: string
          description: |
            What to ask the payer, written by OpenIntents (for a `detail`,
            the agent's own question), never the page's own words. Show it
            to them as it is.
          examples: ["Enter the code blinkit.com just sent to your phone."]
        options:
          type: array
          maxItems: 8
          items:
            type: string
            maxLength: 80
          description: |
            Always present: empty, except for a `detail` that offers choices
            (at most 8, each at most 80 characters). When it is not empty,
            answer with one of them (case-insensitive): anything else is
            `400`.
          examples: [["S", "M", "L"]]
        choices:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/InputChoice"
          description: |
            Always present: empty, except for a `detail` that offers choices
            with ids, descriptions and price changes (2 to 50). Answer with
            the `id` of one in `value`: any other is `422 unknown_option`.
        fields:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/InputField"
          description: |
            Always present: empty, except for a `detail` that is a form. Answer
            every field at once with `values`.
        expects:
          type: string
          description: |
            What a `detail`'s answer must look like: any short `text`, an
            `email`, a `phone` number, or a `choice`. `text` for the other
            kinds.
          enum: [text, email, phone, choice]
        channel:
          type: [string, "null"]
          description: Where the shop sent the code, when known.
          enum: [sms, email, call, app, null]
        length:
          type: [integer, "null"]
          description: How many characters the code has, when the page says.
        url:
          type: string
          format: uri
          description: |
            A page where the payer types the answer themselves. Like a
            sign-in link, it is theirs only: whoever has it can answer.
        image_url:
          type: string
          format: uri
          description: |
            A `payment`'s picture (JPEG) of the shop's payment code, for the
            payer to scan; served only while the request waits. Absent for
            the other kinds. Like `url`, whoever has it can see it.
        expires_at:
          type: string
          format: date-time
          description: |
            5 minutes after the request was made; for a parked `detail`, when
            the intent gives up waiting.
        attempts_left:
          type: integer
          minimum: 0
          description: |
            How many more times the agent may ask for this `kind` in this
            purchase, after this one.

    AnswerInputParams:
      type: object
      additionalProperties: false
      description: |
        `input`, and exactly one of `value`, `values`, `decline` and `done`.
      required: [input]
      minProperties: 2
      maxProperties: 2
      properties:
        input:
          type: string
          description: The `id` of the intent's `input_request`.
          examples: [inp_8f2c41d0a9e7b3f15c62d1aa]
        value:
          type: string
          description: |
            The answer, for `phone`, `email`, `code` and `detail`. A phone
            number is digits, with an optional leading `+`; spaces, dashes,
            dots and parentheses are fine. A code is 3 to 12 letters, digits
            or dashes. A `detail`'s answer is a line of at most 300
            characters or, depending on the question, an email address or a
            phone number; with `options`, one of them (case-insensitive); with
            `choices`, the `id` of one.
        values:
          type: object
          additionalProperties:
            type: string
          description: |
            For a question with `fields`: each field's answer, by its `name`
            (a `choice` field's by option `id`). Every required field must be
            there.
        decline:
          type: boolean
          const: true
          description: The payer would rather not. The agent stops signing them in this way.
        done:
          type: boolean
          const: true
          description: |
            Only for an `approval`, once the payer approved the sign-in, or a
            `payment`, once they paid the shop.

    Receipt:
      type: object
      required: [merchant, total, fee, currency]
      properties:
        merchant:
          type: string
        items:
          type: array
          items:
            type: object
            required: [name, quantity, amount]
            properties:
              name:
                type: string
              quantity:
                type: integer
              amount:
                type: integer
        total:
          type: integer
        fee:
          type: integer
        currency:
          type: string
        confirmation:
          type: [string, "null"]
        receipt_url:
          type: [string, "null"]
          format: uri

    IntentError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          examples: [over_max_amount, out_of_stock, merchant_unavailable, login_required, needs_information, input_expired, limit_exceeded]
        message:
          type: string

    IntentList:
      type: object
      required: [object, data]
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/Intent"
        next_cursor:
          type: [string, "null"]

    Balance:
      type: object
      required: [object, available, held, currency, customer, monthly_limit, per_intent_limit, spent_this_month]
      properties:
        object:
          type: string
          const: balance
        available:
          type: integer
          description: What intents can pay from now.
        held:
          type: integer
          description: Reserved for intents at their payment step.
        currency:
          type: string
        customer:
          type: [string, "null"]
          description: The customer whose balance this is; `null` for your account's.
        monthly_limit:
          type: [integer, "null"]
          description: |
            The most that may leave the balance in a UTC calendar month, in
            cents, or `null` for no limit. See `Customer.limits`.
        per_intent_limit:
          type: [integer, "null"]
          description: The most one purchase may cost, merchant total plus fee, in cents, or `null` for no limit.
        spent_this_month:
          type: integer

    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [type, message]
          properties:
            type:
              type: string
              enum: [invalid_request, authentication, payment, not_found, conflict, rate_limit, api_error]
            code:
              type: string
              examples:
                - live_key_required
                - idempotency_key_reused
                - idempotency_key_in_use
                - profile_busy
                - session_limit
                - session_not_open
                - sessions_unavailable
                - url_not_allowed
                - too_many_commands
                - too_many_streams
                - input_not_waiting
                - rate_limit_exceeded
                - too_many_writes
                - country_unavailable
                - shop_not_allowed
                - sign_ins_unavailable
                - portal_unavailable
                - live_unavailable
                - secrets_unavailable
                - cards_unavailable
                - answer_on_page
                - unknown_option
            message:
              type: string
            param:
              type: string
            lease:
              description: With `profile_busy`, what uses the profile and when its lease next runs out.
              $ref: "#/components/schemas/ProfileLease"

    WebhookEvent:
      type: object
      description: |
        Posted to your endpoint on every status change. Verify the
        `OpenIntents-Signature` header (`t=<unix>,v1=<hex>`): v1 is
        HMAC-SHA256 of `"{t}.{raw body}"` keyed with your `whsec_` secret. While
        a secret is being rotated there is one `v1` for each secret that still
        signs; accept the event if any matches.
      required: [id, type, created_at, data]
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - intent.running
            - intent.requires_payment
            - intent.requires_input
            - intent.requires_login
            - intent.completed
            - intent.failed
            - intent.cancelled
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/Intent"

    MetadataParam:
      type: object
      description: Up to 20 of your own key/value pairs; keys 1 to 40 bytes, values up to 500.
      maxProperties: 20
      propertyNames:
        minLength: 1
        maxLength: 40
      additionalProperties:
        type: string
        maxLength: 500

    Customer:
      type: object
      required: [id, object, external_id, name, email, metadata, limits, created_at]
      properties:
        id:
          type: string
        object:
          type: string
          const: customer
        external_id:
          type: [string, "null"]
          description: Your own ID for them, unique in your account.
        name:
          type: [string, "null"]
        email:
          type: [string, "null"]
        metadata:
          type: object
          additionalProperties:
            type: string
        limits:
          $ref: "#/components/schemas/Limits"
        created_at:
          type: string
          format: date-time

    Limits:
      type: object
      description: |
        What a customer may spend, in cents, counting what leaves their
        balance: the merchant's total plus the fee. `null` is no limit. An
        intent that would go over `per_intent`, or take what was spent this UTC
        calendar month plus what is held for purchases in progress over
        `monthly`, fails with `limit_exceeded`; nothing is held and no payment
        link is offered. Your account's own limits are set in the dashboard.
      required: [per_intent, monthly]
      properties:
        per_intent:
          type: [integer, "null"]
          minimum: 1
          maximum: 1000000000
        monthly:
          type: [integer, "null"]
          minimum: 1
          maximum: 1000000000

    LimitsParams:
      type: object
      additionalProperties: false
      description: A limit left out stays as it is; a number sets it; `null` removes it. Whole numbers from 1 to 1000000000, else `400` naming `per_intent` or `monthly`.
      properties:
        per_intent:
          type: [integer, "null"]
        monthly:
          type: [integer, "null"]

    CustomerParams:
      type: object
      additionalProperties: false
      properties:
        external_id:
          type: string
          maxLength: 200
          description: Your own ID for them, unique in your account; one already in use answers `409 conflict`.
        name:
          type: string
          maxLength: 200
        email:
          type: string
          maxLength: 320
        metadata:
          $ref: "#/components/schemas/MetadataParam"
        limits:
          $ref: "#/components/schemas/LimitsParams"

    CustomerList:
      type: object
      required: [object, data]
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/Customer"
        next_cursor:
          type: [string, "null"]

    CreateTopupParams:
      type: object
      additionalProperties: false
      required: [amount]
      properties:
        amount:
          type: integer
          minimum: 50
          maximum: 1000000
          description: In cents.
        currency:
          type: string
          enum: [usd]
          default: usd
          description: Only `usd` for now.
        customer:
          type: string
          description: Top up this customer's balance instead of your account's.

    Topup:
      type: object
      required: [id, object, amount, currency, customer, status, url, expires_at, created_at]
      properties:
        id:
          type: string
        object:
          type: string
          const: topup
        amount:
          type: integer
        currency:
          type: string
        customer:
          type: [string, "null"]
        status:
          type: string
          description: |
            `open` until paid or until `expires_at` (24 hours after it was
            made). A payment begun in time can still turn an `expired` top-up
            `paid`.
          enum: [open, paid, expired]
        url:
          type: string
          format: uri
          description: Where the payer pays.
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    Event:
      type: object
      description: |
        One step in an intent's or a session's timeline. `type` says what
        `data` holds; new types may appear, so skip the ones you don't know.
        - `status`: `{status, reason?}`, the intent's or session's new status.
          `reason` says why, when there is a why: a failed intent's error
          code, the reason of the payment an intent requires, `paid` when a
          paid intent is queued again, and `payment_expired` when its unpaid
          link expired. A run that moved to a fresh browser shows
          `{status: queued, reason: browser_lost}`; one sent again to get past
          a shop's check, `{status: queued, reason: retrying}`. An intent that
          waits for its payer to sign in shows
          `{status: requires_login, reason: login_required}`, then
          `{status: queued, reason: signed_in}`. While the agent signs the
          payer in itself, or asks them a detail, the intent shows
          `{status: requires_input}` each time it asks them for something
          (its `reason` the request's `kind`), then `{status: running}` (its
          `reason` `answered`, `declined`, `approved` or `expired`). Never
          the answer itself.
        - `step` (intents): `{action}`, what the agent did: `open`, `look`,
          `click`, `type`, `read`.
        - `checkout` (intents): `{merchant, total, currency}`, the payment
          step was reached.
        - `page` (sessions): `{url, title}`, the session's page changed.
        - `command` (sessions): `{id, type, status, typed_chars?}`, a command
          ran; `typed_chars` counts what a `type` action typed.
      required: [id, object, type, created_at, data]
      properties:
        id:
          type: string
        object:
          type: string
          const: event
        type:
          type: string
          examples: [status, step, checkout, page, command]
        created_at:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: true

    EventList:
      type: object
      required: [object, data]
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        next_cursor:
          type: [string, "null"]

    EventStream:
      type: string
      description: |
        Server-Sent Events: each event is `id: <event id>` and
        `data: <Event as JSON>`, then a blank line. Past events come first,
        then new ones as they happen, with a comment line (`:`) now and then
        to keep the connection open. Reconnect with `Last-Event-ID` to resume
        without repeats; a stream may also close on its own after a while,
        and resuming picks it up. Once the intent or session is over and its
        last event is sent, the stream closes. Asking for a stream of
        something that is over with nothing left to send (resuming after its
        last event, say) answers `204 No Content`. Too many open streams
        answer `429` with `code: too_many_streams`; try again shortly.

    ProfileStatus:
      type: string
      description: |
        `ready`: nothing uses it. `in_use`: an intent or a session holds it
        (see `lease`). `forgetting`: being erased, which shows even while an
        intent or a session still finishes with it. `forgotten`: erased, and
        nothing saved in it since.
      enum: [ready, in_use, forgetting, forgotten]

    ProfileLease:
      type: object
      description: What uses the profile now. A profile is used by one intent or session at a time.
      required: [holder, expires_at]
      properties:
        holder:
          type: object
          required: [type, id]
          properties:
            type:
              type: string
              examples: [intent, session]
            id:
              type: string
        expires_at:
          type: string
          format: date-time
          description: When the lease next runs out. It is renewed while the holder works; one that stops lets it lapse.

    Profile:
      type: object
      description: |
        A payer's browser profile: the merchant logins, cookies and carts
        their intents and sessions build up. Your account has one, and so
        does each customer. It is reachable only with your account's keys.
      required: [id, object, customer, status, lease, size_bytes, created_at, last_used_at]
      properties:
        id:
          type: string
          examples: [prf_7c1d04e2a9b3]
        object:
          type: string
          const: profile
        customer:
          type: [string, "null"]
          description: Its customer; `null` for your account's own profile.
        status:
          $ref: "#/components/schemas/ProfileStatus"
        lease:
          oneOf:
            - $ref: "#/components/schemas/ProfileLease"
            - type: "null"
        size_bytes:
          type: [integer, "null"]
          description: The saved profile's size; `null` before anything is saved.
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time
          description: When an intent or a session last took it.

    CreateProfileParams:
      type: object
      additionalProperties: false
      properties:
        customer:
          type: string
          description: Their profile; without it, your account's.

    ProfileList:
      type: object
      required: [object, data]
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/Profile"
        next_cursor:
          type: [string, "null"]

    SessionStatus:
      type: string
      enum: [queued, opening, open, closing, closed, failed]

    CreateSessionParams:
      type: object
      additionalProperties: false
      description: |
        The profile to open, by `profile` or by `customer` but not both;
        neither opens your account's own.
      not:
        required: [profile, customer]
      properties:
        profile:
          type: string
        customer:
          type: string
        start_url:
          type: string
          format: uri
          description: |
            A public `https` URL on the default port; other hosts and ports
            answer `400 url_not_allowed`. Without it, a blank page.
        max_minutes:
          type: integer
          minimum: 1
          maximum: 15
          default: 15
          description: Counted from when the session opens. The limit may change.
        country:
          type: string
          pattern: "^[a-z]{2}$"
          description: See `CreateIntentParams`.
        end_user_ip:
          type: string
          description: See `CreateIntentParams`.
        webhook_url:
          type: string
          format: uri
          description: |
            A URL that receives this session's events (`session.*`) as well as
            your endpoints', signed with a secret made for the session and
            returned once, as `webhook_secret`, in this create response.

    Session:
      type: object
      description: A browser opened on a profile without an intent.
      required: [id, object, profile, customer, status, test, webhook_url, country, country_source, created_at, expires_at]
      properties:
        id:
          type: string
        object:
          type: string
          const: session
        profile:
          type: string
        customer:
          type: [string, "null"]
        status:
          $ref: "#/components/schemas/SessionStatus"
        test:
          type: boolean
          description: Opened with a test key.
        start_url:
          type: [string, "null"]
          format: uri
        url:
          type: [string, "null"]
          format: uri
          description: The page it is on now.
        title:
          type: [string, "null"]
        webhook_url:
          type: [string, "null"]
          format: uri
          description: Where this session's own events go, if it was opened with a `webhook_url`.
        webhook_secret:
          type: string
          description: The secret that signs the `webhook_url` deliveries (`whsec_...`). Only in the create response.
        country:
          type: [string, "null"]
          description: The country its browser goes out from.
        country_source:
          oneOf:
            - $ref: "#/components/schemas/CountrySource"
            - type: "null"
        created_at:
          type: string
          format: date-time
        opened_at:
          type: [string, "null"]
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: When it closes by itself, at the latest.
        closed_at:
          type: [string, "null"]
          format: date-time
        close_reason:
          type: [string, "null"]
          description: |
            Why it ended: `released` by you, `idle` (5 minutes with no command
            sent or run; screenshots and event streams do not count),
            `timed_out` (`max_minutes`), `data_limit` (its pages used more
            data than a session may), `browser_lost` (the browser stopped: the
            session `failed`, and the profile keeps what was last saved), or
            `error`. Others may appear.
          examples: [released, idle, timed_out, data_limit, browser_lost, error]

    SessionList:
      type: object
      required: [object, data]
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/Session"
        next_cursor:
          type: [string, "null"]

    SessionCommand:
      description: |
        One thing to do on the session's page. A session never enters payment
        details or places an order. These are `refused`, with
        `payment_not_allowed`:
        - an `act` on a control recognized as placing an order or paying
          (also subscribing, donating, booking and the like), and on a
          checkout page also on a bare "Continue", "Confirm", "Submit",
          "Next" or similar;
        - any action on a payment card field;
        - typing what looks like a card number;
        - Enter (pressed, or typed as a line break) at a checkout or where an
          order control is shown.

        The text of a `type` action is kept only until the command runs;
        results and events never return it (events show `typed_chars`),
        though the page itself may show it.
      oneOf:
        - $ref: "#/components/schemas/NavigateCommand"
        - $ref: "#/components/schemas/SnapshotCommand"
        - $ref: "#/components/schemas/ActCommand"
        - $ref: "#/components/schemas/ReadCommand"
      discriminator:
        propertyName: type
        mapping:
          navigate: "#/components/schemas/NavigateCommand"
          snapshot: "#/components/schemas/SnapshotCommand"
          act: "#/components/schemas/ActCommand"
          read: "#/components/schemas/ReadCommand"

    NavigateCommand:
      type: object
      additionalProperties: false
      required: [type, url]
      properties:
        type:
          type: string
          const: navigate
        url:
          type: string
          format: uri
          description: |
            A public `https` URL on the default port; other hosts and ports
            are `refused` (`url_not_allowed`).

    SnapshotCommand:
      type: object
      additionalProperties: false
      description: |
        The page's accessibility tree, with a `ref` on each element you can
        act on. It never includes what text fields hold.
      required: [type]
      properties:
        type:
          type: string
          const: snapshot

    ActCommand:
      type: object
      additionalProperties: false
      description: |
        Act on an element by its `ref` from the latest snapshot.

        After a `navigate`, and after any `act` except a `type` without line
        breaks, the refs of the latest snapshot are forgotten: take a new
        snapshot before the next `act`, which otherwise `failed` with
        `not_found`. An `act` also fails `not_found` when the page changed
        since the latest snapshot (it is on another URL).

        `type` works only on text fields: typing into anything else `failed`
        with `not_actionable`. Frames are not acted on: act on the elements
        inside them, which have refs of their own.
      required: [type, ref, action]
      properties:
        type:
          type: string
          const: act
        ref:
          type: string
          examples: [e12]
        action:
          type: string
          enum: [click, type, select, press]
        text:
          type: string
          description: |
            For `type`, the text to type. It may contain line breaks but no
            other control characters (a Tab, say): `400`.
        value:
          type: string
          description: For `select`, the option.
        key:
          type: string
          description: |
            For `press`, one key, alone or combined only with Shift or
            Control, such as `Enter`, `Tab`, `Shift+Tab` or `Control+a`. More
            than one key, or a combination with Alt or Meta, answers `400`.
      allOf:
        - if:
            properties:
              action:
                const: type
          then:
            required: [text]
        - if:
            properties:
              action:
                const: select
          then:
            required: [value]
        - if:
            properties:
              action:
                const: press
          then:
            required: [key]

    ReadCommand:
      type: object
      additionalProperties: false
      description: The page's readable text.
      required: [type]
      properties:
        type:
          type: string
          const: read
        selector:
          type: string
          description: A CSS selector, to read one element; without it, the whole page.

    Failure:
      type: object
      description: Why a session command was `refused` or `failed`.
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            `refused`: `payment_not_allowed` (see `SessionCommand`) or
            `url_not_allowed` (see `NavigateCommand`). `failed`: `not_found`
            and `not_actionable` (see `ActCommand`), `timed_out`,
            `browser_error`, `browser_lost` (the browser stopped, and the
            session `failed` with it), or `session_closed` (the session ended
            before the command finished). Others may appear.
          examples:
            - payment_not_allowed
            - url_not_allowed
            - not_found
            - not_actionable
            - timed_out
            - browser_error
            - browser_lost
            - session_closed
        message:
          type: string

    SessionCommandResult:
      type: object
      required: [id, object, type, status, created_at]
      properties:
        id:
          type: string
        object:
          type: string
          const: session_command
        type:
          type: string
          examples: [navigate, snapshot, act, read]
        status:
          type: string
          enum: [pending, done, refused, failed]
        url:
          type: [string, "null"]
          format: uri
          description: The page after the command.
        title:
          type: [string, "null"]
        snapshot:
          type: [string, "null"]
          description: For `snapshot`, the tree. It never includes what text fields hold.
        text:
          type: [string, "null"]
          description: For `read`, the text.
        error:
          description: Why it was `refused` or `failed`.
          oneOf:
            - $ref: "#/components/schemas/Failure"
            - type: "null"
        created_at:
          type: string
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time

    SessionWebhookEvent:
      type: object
      required: [id, type, created_at, data]
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - session.opened
            - session.closed
            - session.failed
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/Session"

    CountrySource:
      type: string
      description: |
        Why a browser goes out from its `country`: you named it (`explicit`),
        it is the country the payer last browsed from (`payer`), it was
        inferred from the `end_user_ip` you gave (`end_user_ip`), from the
        address the payer's own page was opened from (`request_ip`), or it is
        the default (`default`). Others may appear.
      enum: [explicit, payer, end_user_ip, request_ip, default]

    InputChoice:
      type: object
      description: One of the choices a question offers, such as a seat, a fare or a delivery slot.
      required: [id, label]
      properties:
        id:
          type: string
          maxLength: 40
          description: "What an answer names. Letters, digits and `_ . : / -`, unique in the question."
          examples: [seat_12a]
        label:
          type: string
          maxLength: 80
          description: What the payer reads.
        description:
          type: string
          maxLength: 200
          description: More to read.
        price_delta:
          type: integer
          description: What choosing it adds to the price (negative, takes off), in minor units of `currency`.
        currency:
          type: string
          description: The currency of `price_delta`; the intent's when it names none.

    InputField:
      type: object
      description: One field of a form a question asks the payer to fill in.
      required: [name, label, type, required]
      properties:
        name:
          type: string
          maxLength: 40
          description: The key of this field's answer in `values`. A lowercase letter, then lowercase letters, digits and `_`.
          examples: [seat_row]
        label:
          type: string
          description: What the payer reads.
        type:
          type: string
          description: |
            What it takes: a line of `text`, an `email`, a `phone` number, a
            `date` (`YYYY-MM-DD`), a decimal `number`, or a `choice` of its
            `options`, answered by the option's `id`.
          enum: [text, email, phone, date, number, choice]
        required:
          type: boolean
          description: A required field must be answered.
        options:
          type: array
          minItems: 2
          maxItems: 50
          description: For a `choice` field, its options. Absent for other types.
          items:
            $ref: "#/components/schemas/InputChoice"

    PortalSession:
      type: object
      description: |
        A link to a customer's own page, shown once. Send `url` to the
        customer only.
      required: [id, object, customer, country, country_source, url, expires_at]
      properties:
        id:
          type: string
        object:
          type: string
          const: portal_session
        customer:
          type: string
        country:
          type: string
          description: The country the customer's browser goes out from.
        country_source:
          $ref: "#/components/schemas/CountrySource"
        url:
          type: string
          format: uri
          description: Works once, until `expires_at`.
        expires_at:
          type: string
          format: date-time
          description: "When `url` stops working: 30 minutes on, or sooner if `ttl_seconds` is shorter."

    CreatePortalSessionParams:
      type: object
      additionalProperties: false
      properties:
        return_url:
          type: string
          format: uri
          description: A public `https` URL the page offers a way back to.
        country:
          type: string
          pattern: "^[a-z]{2}$"
          description: See `CreateIntentParams`.
        end_user_ip:
          type: string
          description: See `CreateIntentParams`.
        ttl_seconds:
          type: integer
          minimum: 60
          maximum: 86400
          default: 28800
          description: How long the customer's session lasts once they open the link.

    SecretKind:
      type: string
      description: |
        What a secret holds, and so which `fields` it takes (all text; a
        required field must be sent). Fields marked public come back on the
        secret as `public`; the others are sealed and never come back.
        - `card`: `token` (required, a payment-method token, `pm_...`, made by
          the card form, never a card number) and the public `brand`, `last4`,
          `exp_month`, `exp_year` (all required). A card funds a balance; it
          is never typed into a shop.
        - `address`: `recipient_name`, `line1`, `postal_code` (required),
          `line2`, `phone`; public `city`, `country` (required, two letters),
          `region`.
        - `contact`: `given_name`, `family_name`, `email`, `phone`; at least
          one.
        - `identity_document`: `number` (required), `full_name`,
          `date_of_birth`, `expiry` (`YYYY-MM-DD`); public `document_type`
          (`passport`, `national_id`, `drivers_license`, `residence_permit`)
          and `issuing_country` (two letters), both required.
        - `shop_password`: `username`, `password` (required). Needs exactly
          one shop in `shops`.
        - `loyalty`: `member_number` (required), `pin`; public `program`
          (required).
      enum: [card, address, contact, identity_document, shop_password, loyalty]

    CreateSecretParams:
      type: object
      additionalProperties: false
      required: [kind, label, fields]
      properties:
        customer:
          type: string
          description: The customer it is for; without it, your account's own.
        kind:
          $ref: "#/components/schemas/SecretKind"
        label:
          type: string
          maxLength: 60
          description: |
            A name for it, such as `Home` or `Work passport`. It is shown in
            lists and to agents, so it is not secret: put no value in it.
        fields:
          type: object
          description: The kind's fields (see `SecretKind`), as text, up to 4 KB in all.
          additionalProperties:
            type: string
        shops:
          type: array
          items:
            type: string
          description: |
            Shops it may be used on, as domains. Without any, an intent may
            name the shops itself (see `CreateIntentParams.shops`). A
            `shop_password` needs exactly one; a `card` takes none.
        default:
          type: boolean
          description: Offer this one first among the payer's secrets of its kind. A purchase that names no `secrets` may use the payer's defaults.
        expires_at:
          type: string
          format: date-time
          description: After this time it is no longer offered and is deleted.

    Secret:
      type: object
      description: |
        A stored secret as you may see it: never its values. The `mask` is
        what a person may be shown to recognise it (`Visa ••4242`), and
        `public` holds the few fields its kind keeps in the clear.
      required: [id, object, customer, kind, label, mask, public, shops, default, mode, entered_by, version, created_at, updated_at, expires_at, last_used_at]
      properties:
        id:
          type: string
          examples: [sec_9c1b7a40d3e85f26]
        object:
          type: string
          const: secret
        customer:
          type: [string, "null"]
          description: The customer it belongs to; `null` for your account's own.
        kind:
          $ref: "#/components/schemas/SecretKind"
        label:
          type: string
        mask:
          type: string
        public:
          type: object
          additionalProperties:
            type: string
        shops:
          type: array
          items:
            type: string
        default:
          type: boolean
        mode:
          type: string
          enum: [test, live]
          description: The mode of the key that wrote it. A key sees only secrets of its own mode.
        entered_by:
          type: string
          description: "`developer` through this API, `payer` on their own page (see `POST /customers/{id}/secret_requests`)."
          enum: [developer, payer]
        version:
          type: integer
          description: Goes up each time it is replaced.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time

    SecretList:
      type: object
      required: [object, data]
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/Secret"
        next_cursor:
          type: [string, "null"]

    SecretUse:
      type: object
      description: One row of a secret's history. Never a value or a mask.
      required: [id, object, secret, kind, action, actor, outcome, field_names, at]
      properties:
        id:
          type: string
          examples: [aud_5b0e7d21c4a98f36]
        object:
          type: string
          const: secret_use
        secret:
          type: string
        kind:
          $ref: "#/components/schemas/SecretKind"
        action:
          type: string
          description: |
            `create`, `replace`, `delete`, `expire` (it passed its
            `expires_at` and its values were taken away), `fill` (a value was
            typed into a shop), `fund` (a card funded a balance) or `refuse`
            (a check turned a use away). Others may appear.
        actor:
          type: string
          description: "`worker`, `api`, `payer`, `developer` or `system`."
        outcome:
          type: string
          enum: [ok, refused]
        reason:
          type: [string, "null"]
          description: "Why a use was refused: `shop_not_allowed`, `expired` or `wrong_use`. Others may appear."
        field:
          type: [string, "null"]
          description: The field a fill or refusal was about.
        field_names:
          type: array
          items:
            type: string
          description: The names of the fields a create or replace set.
        shop:
          type: [string, "null"]
          description: The domain a value was typed on, or asked to be.
        intent:
          type: [string, "null"]
        at:
          type: string
          format: date-time

    SecretUseList:
      type: object
      required: [object, data]
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/SecretUse"
        next_cursor:
          type: [string, "null"]

    CreateSecretRequestParams:
      type: object
      additionalProperties: false
      required: [kinds]
      properties:
        kinds:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SecretKind"
          description: The kinds of secret the page asks for.
        return_url:
          type: string
          format: uri
          description: A public `https` URL the page offers a way back to.
        ttl_seconds:
          type: integer
          minimum: 60
          maximum: 604800
          default: 86400
          description: How long the link works.

    SecretRequestCreated:
      type: object
      description: A request for a customer's secrets, with the link to send them.
      required: [id, object, customer, kinds, url, expires_at]
      properties:
        id:
          type: string
          examples: [sr_3d71c0b8a2e94f65]
        object:
          type: string
          const: secret_request
        customer:
          type: string
        kinds:
          type: array
          items:
            $ref: "#/components/schemas/SecretKind"
        url:
          type: string
          format: uri
          description: For the customer only. Works once, until `expires_at`.
        expires_at:
          type: string
          format: date-time

    SecretRequest:
      type: object
      description: |
        Where a request for a customer's secrets stands. It is also the `data`
        of the `secret_request.completed` webhook.
      required: [id, object, customer, mode, kinds, state, expires_at, completed_at, secrets]
      properties:
        id:
          type: string
        object:
          type: string
          const: secret_request
        customer:
          type: string
        mode:
          type: string
          enum: [test, live]
        kinds:
          type: array
          items:
            $ref: "#/components/schemas/SecretKind"
        state:
          type: string
          description: "`pending` until the customer fills it in, then `done`; `expired` if they did not in time."
          enum: [pending, done, expired]
        expires_at:
          type: string
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time
        secrets:
          type: array
          items:
            type: string
          description: The handles (`sec_...`) of the secrets the customer made. Read each with `GET /secrets/{id}`.

    LiveLink:
      type: object
      description: A link to a session's live view, shown once. Whoever holds `url` can drive the session.
      required: [object, session, url, expires_at]
      properties:
        object:
          type: string
          const: live_link
        session:
          type: string
        url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
          description: 10 minutes after it was made.

    CreateSignInParams:
      type: object
      additionalProperties: false
      required: [shop_url]
      properties:
        shop_url:
          type: string
          format: uri
          description: A public `https` URL on the shop, on the default port. The page opens there.
        customer:
          type: string
          description: Sign this customer in; without it, your account's own profile.
        country:
          type: string
          pattern: "^[a-z]{2}$"
          description: See `CreateIntentParams`.
        end_user_ip:
          type: string
          description: See `CreateIntentParams`.
        return_url:
          type: string
          format: uri
          description: A public `https` URL the page offers a way back to.

    SignIn:
      type: object
      description: |
        A link where a payer signs in to a shop with no intent attached. It is
        also the `data` of the `sign_in.*` webhooks, without `url`.
      required: [id, object, status, customer, shop, country, country_source, return_url, test, created_at, expires_at, ended_at]
      properties:
        id:
          type: string
          examples: [sgn_6a20e4b19c7d3f58]
        object:
          type: string
          const: sign_in
        status:
          type: string
          description: |
            `open` until the payer opens it, `active` while their browser is
            open, then `done` (they signed in), `declined`, `expired` or
            `cancelled`. Others may appear.
          enum: [open, active, done, declined, expired, cancelled]
        customer:
          type: [string, "null"]
        shop:
          type: string
          description: The shop's domain, such as `amazon.com`.
        country:
          type: [string, "null"]
          description: The country the payer's browser goes out from.
        country_source:
          oneOf:
            - $ref: "#/components/schemas/CountrySource"
            - type: "null"
        return_url:
          type: [string, "null"]
          format: uri
        url:
          type: string
          format: uri
          description: The page for the payer only. Not in webhooks.
        test:
          type: boolean
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        ended_at:
          type: [string, "null"]
          format: date-time

    WebhookEndpoint:
      type: object
      required: [id, object, url, events, disabled, created_at]
      properties:
        id:
          type: string
          examples: [we_4c82a1d09b7e3f56]
        object:
          type: string
          const: webhook_endpoint
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
          description: "The event types it receives. Empty: every intent event."
        disabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        previous_secret_expires_at:
          type: string
          format: date-time
          description: Present while the secret before the last rotation still signs as well.
        secret:
          type: string
          description: The signing secret (`whsec_...`). Only in the create and rotate responses.

    CreateWebhookEndpointParams:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          description: "`https` on the default port, resolving to a public address."
        events:
          type: array
          items:
            type: string
          description: |
            Event types to receive, such as `intent.completed` or
            `sign_in.completed`. Without any, every intent event. An unknown
            type is `400` naming `events`.

    UpdateWebhookEndpointParams:
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
        events:
          type: array
          items:
            type: string
          description: Replaces the list. `[]` is every intent event.
        disabled:
          type: boolean

    WebhookEndpointList:
      type: object
      required: [object, data]
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEndpoint"
        next_cursor:
          type: [string, "null"]

    WebhookDelivery:
      type: object
      description: One send of an event to an endpoint.
      required: [id, object, endpoint, event_id, event_type, status, attempts, response_code, error, created_at, delivered_at, redelivery_of]
      properties:
        id:
          type: string
          examples: [whd_8f2c41d0a9e7b3f15c62d1aa]
        object:
          type: string
          const: webhook_delivery
        endpoint:
          type: [string, "null"]
        event_id:
          type: string
        event_type:
          type: string
        status:
          type: string
          description: "`pending` while it is being tried (and retried), then `delivered` or `failed`."
          enum: [pending, delivered, failed]
        attempts:
          type: integer
        response_code:
          type: [integer, "null"]
          description: What your receiver answered on the last attempt, if it answered.
        error:
          type: [string, "null"]
          description: Why the last attempt failed, if it got no answer.
        created_at:
          type: string
          format: date-time
        next_attempt_at:
          type: string
          format: date-time
          description: The next attempt. Only while `pending`.
        delivered_at:
          type: [string, "null"]
          format: date-time
        redelivery_of:
          type: [string, "null"]
          description: The delivery this one sends again.

    WebhookDeliveryList:
      type: object
      required: [object, data]
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/WebhookDelivery"
        next_cursor:
          type: [string, "null"]

    SignInWebhookEvent:
      type: object
      description: |
        A sign-in link ended. Sent only to endpoints that list the type.
        `sign_in.completed`: the payer signed in. `sign_in.expired`: the link
        ran out. `data` is the `SignIn` without `url`.
      required: [id, type, created_at, data]
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - sign_in.completed
            - sign_in.expired
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/SignIn"

    SecretRequestWebhookEvent:
      type: object
      description: |
        A customer filled in a secret request. Sent only to endpoints that
        list the type. `data` holds the handles of the secrets made, never a
        value.
      required: [id, type, created_at, data]
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - secret_request.completed
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/SecretRequest"

    WebhookTestEvent:
      type: object
      description: |
        What `POST /webhook_endpoints/{id}/test` sends, to that endpoint
        alone. It is not an event type you can subscribe to.
      required: [id, type, created_at, data]
      properties:
        id:
          type: string
        type:
          type: string
          const: webhook_endpoint.test
        created_at:
          type: string
          format: date-time
        data:
          type: object
          required: [endpoint, message]
          properties:
            endpoint:
              type: string
            message:
              type: string
